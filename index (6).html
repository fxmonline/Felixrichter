<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detektiv Felix Richter – Die Akten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07111f; --deep:#0c1d33; --panel:#102a46; --line:#1d4a6e;
  --teal:#2fd5c8; --teal-dim:#1a8f88; --gold:#e8b53a; --paper:#e9e2cf; --ink:#1b1a17;
  --wood:#6b4423; --wood-dark:#4a2e16; --wood-light:#8a5a31;
  --head:'Press Start 2P','Courier New',monospace;
  --body:'VT323','Courier New',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-color:var(--teal) var(--night)}
::-webkit-scrollbar{width:12px}::-webkit-scrollbar-track{background:var(--night)}
::-webkit-scrollbar-thumb{background:var(--teal-dim);border:2px solid var(--night)}
body{
  margin:0;min-height:100vh;color:var(--paper);font-family:var(--body);font-size:22px;line-height:1.35;
  background:
    linear-gradient(rgba(47,213,200,.05) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(47,213,200,.05) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(180deg,var(--night),var(--deep));
}
header{max-width:960px;margin:0 auto;padding:40px 20px 24px}
h1{font-family:var(--head);font-weight:400;font-size:clamp(22px,4.6vw,40px);line-height:1.35;margin:0;color:var(--gold);text-shadow:4px 4px 0 #000}
main{max-width:960px;margin:0 auto;padding:12px 20px 80px}

/* Admin-Leiste */
.bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 36px;min-height:48px}
.bar form,#loggedIn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.bar input{font-family:var(--body);font-size:22px;width:140px;padding:8px 10px;color:var(--paper);background:var(--night);
  border:4px solid #000;box-shadow:inset 0 0 0 3px var(--line)}
.bar input:focus{outline:none;box-shadow:inset 0 0 0 3px var(--teal)}
.who{color:var(--teal);font-size:22px}
.err{color:#ff7a7a;font-size:22px}

/* Regal */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:44px 28px;padding:32px 24px 0;
  background:var(--wood-dark);border:4px solid #000;box-shadow:inset 0 0 0 4px var(--wood)}
.slot{position:relative;padding-bottom:26px}
.slot::after{content:"";position:absolute;left:-24px;right:-24px;bottom:0;height:22px;background:var(--wood-light);
  border-top:4px solid #a8723e;border-bottom:4px solid #000}
.book{position:relative;display:block;width:100%;aspect-ratio:3/4;border:4px solid #000;padding:18px 14px 14px 30px;text-align:left;
  color:#fff;cursor:pointer;font:inherit;background:var(--c);
  box-shadow:inset -6px 0 0 rgba(0,0,0,.25),inset 0 -6px 0 rgba(0,0,0,.25),6px 6px 0 rgba(0,0,0,.45);
  transition:transform .12s steps(2)}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:rgba(0,0,0,.35);border-right:4px solid #000}
.book::after{content:"";position:absolute;left:30px;right:14px;top:96px;height:4px;background:var(--gold);opacity:.8}
.book:hover,.book:focus-visible{transform:translateY(-8px)}
.book:focus-visible{outline:4px solid var(--teal);outline-offset:4px}
.book .band{font-family:var(--head);font-size:10px;color:var(--gold);display:block;margin-bottom:14px;min-height:16px}
.book .title{font-family:var(--head);font-size:13px;line-height:1.6;display:block;text-shadow:2px 2px 0 #000}
.book .lock{position:absolute;right:12px;bottom:12px;width:40px;height:40px}
.book.open .lock{display:none}
.glyph{display:block;height:22px;width:auto;margin:0 0 8px;color:#fff;filter:drop-shadow(2px 2px 0 #000)}
.glyph.small{height:16px;color:var(--gold);margin-bottom:14px}

/* Dialoge */
.overlay{position:fixed;inset:0;background:rgba(2,6,12,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.show{display:flex}
.box{width:min(420px,100%);background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 4px var(--line),8px 8px 0 #000;padding:28px 24px;text-align:center}
.box h2{font-family:var(--head);font-weight:400;font-size:15px;line-height:1.7;margin:0 0 8px;color:var(--gold)}
.box p{margin:0 0 18px;color:#bcd3e0}
.digits{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.digit{width:56px;height:68px;background:var(--night);border:4px solid #000;box-shadow:inset 0 0 0 3px var(--line);
  font-family:var(--head);font-size:26px;color:var(--teal);display:flex;align-items:center;justify-content:center}
.digit.on{box-shadow:inset 0 0 0 3px var(--teal)}
.msg{min-height:28px;margin-bottom:10px;font-size:22px}
.msg.err{color:#ff7a7a}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:0 auto 16px}
.k,.btn{font-family:var(--head);font-size:16px;color:#fff;background:#1c4466;border:4px solid #000;padding:14px 0;cursor:pointer;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.15)}
.k:hover,.btn:hover{background:#245a85}
.k:active,.btn:active{transform:translate(2px,2px)}
.k:focus-visible,.btn:focus-visible{outline:4px solid var(--teal);outline-offset:2px}
.k.ok{background:#1a8f88}
.btn{padding:12px 18px;font-size:12px}
.shake{animation:shake .35s steps(6)}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

/* Akte / Editor */
.file{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);border:4px solid #000;
  box-shadow:inset 0 0 0 4px #bdb394,8px 8px 0 #000;padding:32px 30px;font-size:24px;line-height:1.4}
.file h2{font-family:var(--head);font-weight:400;font-size:16px;line-height:1.7;margin:0 0 6px;color:#7a1f1f}
.file .sub{font-family:var(--head);font-size:10px;color:#5a5340;margin:0 0 22px}
.file p{margin:0 0 14px;max-width:60ch}
.file label{display:block;font-family:var(--head);font-size:10px;color:#5a5340;margin:14px 0 6px}
.file input,.file textarea{width:100%;font-family:var(--body);font-size:22px;color:var(--ink);background:#f6f1e1;border:4px solid #000;padding:8px 10px}
.file textarea{min-height:220px;resize:vertical;line-height:1.35}
.file input:focus,.file textarea:focus{outline:4px solid var(--teal);outline-offset:0}
.file label.chk{display:flex;gap:10px;align-items:flex-start;font-family:var(--body);font-size:22px;color:var(--ink);margin:14px 0 0}
.file input[type=checkbox]{width:24px;height:24px;margin-top:4px;flex:none}
.file .hint{font-size:20px;color:#5a5340;margin:10px 0 0}
.file .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.load{grid-column:1/-1;margin:0 0 26px;color:var(--paper)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:20;max-width:90vw;text-align:center;
  background:var(--panel);color:var(--paper);border:4px solid #000;box-shadow:inset 0 0 0 3px var(--line),6px 6px 0 #000;
  padding:12px 20px;font-size:22px;display:none}
.toast.show{display:block}
@media (prefers-reduced-motion:reduce){.book,.shake{animation:none;transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar" id="bar">
    <form id="loginForm" autocomplete="off">
      <input id="user" type="text" placeholder="Benutzer" aria-label="Benutzername">
      <input id="pass" type="password" placeholder="Passwort" aria-label="Passwort">
      <button class="btn" type="submit">Login</button>
      <span class="err" id="loginErr" role="alert"></span>
    </form>
    <div id="loggedIn" hidden>
      <span class="who">Angemeldet als admin</span>
      <button class="btn" id="logout" type="button">Abmelden</button>
    </div>
  </div>
  <h1>Detektiv Felix Richter</h1>
</header>
<main>
  <div class="shelf" id="shelf"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Code eingeben -->
<div class="overlay" id="codeOverlay" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
  <div class="box" id="codeBox">
    <h2 id="codeTitle">Zahlencode eingeben</h2>
    <p id="codeBook"></p>
    <div class="digits" id="digits" aria-live="polite"></div>
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad"></div>
    <button class="btn" id="cancel" type="button">Abbrechen</button>
  </div>
</div>

<!-- Akte lesen / bearbeiten -->
<div class="overlay" id="fileOverlay" role="dialog" aria-modal="true" aria-labelledby="fileTitle">
  <div class="file" id="fileBox">
    <h2 id="fileTitle"></h2>
    <p class="sub" id="fileSub"></p>
    <div id="fileText"></div>
    <div class="row">
      <button class="btn" id="saveFile" type="button" hidden>Speichern</button>
      <button class="btn" id="closeFile" type="button">Schließen</button>
    </div>
  </div>
</div>

<script>
// ====== EINSTELLUNGEN (Codes, Texte, Admin-Login) ======
// code leer + soon:false = ohne Code offen. soon:true = noch nicht verfügbar (Zauberschrift).
const OFFLINE_ADMIN = {user: "admin", pass: "123"};
const OFFLINE = [
  {title:"Labyrinth",   code:"1232", soon:false, text:["Wird morgen (Sonntag, 8. November) um 18 Uhr freigeschaltet."]},
  {title:"Titel folgt", code:"",     soon:true,  text:["Text für Akte II."]},
  {title:"Titel folgt", code:"",     soon:true,  text:["Text für Akte III."]},
  {title:"Titel folgt", code:"",     soon:true,  text:["Text für Akte IV."]},
  {title:"Titel folgt", code:"",     soon:true,  text:["Text für Akte V."]},
  {title:"Titel folgt", code:"",     soon:true,  text:["Text für Akte VI."]}
];
// ====== COVER (Farben und Bandnummer) ======
const COVERS = [
  {band:"Akte I",   color:"#1f4f8f"}, {band:"Akte II",  color:"#7a2430"}, {band:"Akte III", color:"#2c6b4a"},
  {band:"Akte IV",  color:"#6b4a9a"}, {band:"Akte V",   color:"#8a4a1c"}, {band:"Akte VI",  color:"#1a6f78"}
];
// ===========================

const $ = id => document.getElementById(id);
const lockSvg = '<svg class="lock" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true">'
 + '<path fill="#000" d="M2 0h6v1h1v4H1V1h1z"/><path fill="#e8b53a" d="M3 1h4v1h1v3H2V2h1z"/><path fill="#6b4423" d="M3 2h4v2H3z"/>'
 + '<path fill="#000" d="M0 4h10v6H0z"/><path fill="#e8b53a" d="M1 5h8v4H1z"/><path fill="#000" d="M4 6h2v2H4z"/></svg>';

// ---------- Zauberschrift (zufällige Zeichen, ohne Bedeutung) ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function glyphs(seed, n, cls){
  const r = rng(seed * 9973 + 17), pts = [[1,1],[3,1],[5,1],[1,4],[3,4],[5,4],[1,7],[3,7],[5,7]];
  let d = "";
  for (let g = 0; g < n; g++){
    const ox = g * 7, segs = 2 + Math.floor(r() * 3);
    for (let k = 0; k < segs; k++){
      const p = pts[Math.floor(r() * 9)], q = pts[Math.floor(r() * 9)];
      d += "M" + (p[0] + ox) + " " + p[1] + "L" + (q[0] + ox) + " " + q[1];
    }
    if (r() > .55){ const p = pts[Math.floor(r() * 9)]; d += "M" + (p[0] + ox) + " " + p[1] + "h.01"; }
  }
  return '<svg class="glyph ' + (cls || "") + '" viewBox="0 0 ' + (n * 7) + ' 8" style="width:' + (n * 7 * 2.9) + 'px" aria-hidden="true">'
    + '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="square"/></svg>';
}

// ---------- Daten (alles lokal in dieser Datei) ----------
async function openApi(i, code){
  const b = OFFLINE[i]; if (!b) return {ok: false, error: "bad"};
  if (b.soon) return {ok: false, error: "soon"};
  return (!b.code || code === b.code) ? {ok: true, title: b.title, text: b.text} : {ok: false, error: "wrong"};
}
async function adminApi(user, pass){
  return (user === OFFLINE_ADMIN.user && pass === OFFLINE_ADMIN.pass) ? {ok: true, books: OFFLINE} : {ok: false, error: "auth"};
}
async function saveApi(i, rec){ Object.assign(OFFLINE[i], rec); return {ok: true}; }

// ---------- Zustand ----------
const shelf = $("shelf");
let pub = [], admin = false, cred = null, adminData = null;
let current = null, entered = "", busy = false, fileIndex = null, lastFocus = null, lastIdx = null, toastTimer;

function toast(t, ms){
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), ms || 3000);
}
function restoreFocus(){
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  else if (lastIdx !== null){ const el = shelf.querySelector('.book[data-i="' + lastIdx + '"]'); if (el) el.focus(); }
}

// ---------- Regal ----------
function renderShelf(){
  shelf.innerHTML = "";
  COVERS.forEach((c, i) => {
    const p = pub[i] || {title: "", soon: true, codeLen: 0};
    const slot = document.createElement("div"); slot.className = "slot";
    const btn = document.createElement("button");
    const free = admin || (!p.soon && !p.codeLen);
    btn.type = "button"; btn.className = "book" + (free ? " open" : ""); btn.style.setProperty("--c", c.color); btn.dataset.i = i;
    btn.innerHTML = '<span class="band"></span><span class="title"></span>' + lockSvg;
    const band = btn.querySelector(".band"), title = btn.querySelector(".title");
    if (p.soon){
      band.innerHTML = glyphs((i + 1) * 7 + 1, 4, "small");
      title.innerHTML = glyphs((i + 1) * 7 + 2, 5) + glyphs((i + 1) * 7 + 3, 4);
      btn.setAttribute("aria-label", "Buch " + c.band + " (noch nicht verfügbar)");
    } else {
      band.textContent = c.band; title.textContent = p.title;
      btn.setAttribute("aria-label", c.band + ": " + p.title + (p.codeLen && !admin ? " (gesperrt)" : ""));
    }
    btn.addEventListener("click", () => openBook(i, btn));
    slot.appendChild(btn); shelf.appendChild(slot);
  });
}
async function openBook(i, btn){
  lastFocus = btn; lastIdx = i;
  const p = pub[i] || {soon: true, codeLen: 0};
  if (admin){ showEditor(i); return; }
  if (p.soon){ toast("Dieses Buch ist noch nicht verfügbar."); return; }
  if (!p.codeLen){
    let res; try { res = await openApi(i, ""); } catch (e) { toast("Keine Verbindung. Bitte später nochmal versuchen."); return; }
    if (res.ok) showRead(i, res); else toast("Dieses Buch ist gerade nicht verfügbar.");
    return;
  }
  openCode(i);
}

// ---------- Code eingeben ----------
const pad = $("pad");
["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(k => {
  const el = document.createElement("button"); el.type = "button"; el.className = "k" + (k === "OK" ? " ok" : "");
  el.textContent = k; el.addEventListener("click", () => press(k)); pad.appendChild(el);
});
function renderDigits(){
  const d = $("digits"), n = pub[current].codeLen; d.innerHTML = "";
  for (let i = 0; i < n; i++){
    const s = document.createElement("div");
    s.className = "digit" + (i === entered.length ? " on" : "");
    s.textContent = entered[i] ? "●" : "";
    d.appendChild(s);
  }
}
function setMsg(t, err){ const m = $("msg"); m.textContent = t || ""; m.className = "msg" + (err ? " err" : ""); }
function openCode(i){
  current = i; entered = ""; busy = false;
  $("codeBook").textContent = COVERS[i].band + " – " + pub[i].title;
  setMsg("Diese Akte ist gesperrt."); renderDigits();
  $("codeOverlay").classList.add("show"); pad.querySelector(".k").focus();
}
function closeCode(){ $("codeOverlay").classList.remove("show"); restoreFocus(); }
function press(k){
  if (busy) return;
  const n = pub[current].codeLen;
  if (k === "⌫"){ entered = entered.slice(0, -1); setMsg(""); renderDigits(); return; }
  if (k === "OK") return check();
  if (entered.length < n){ entered += k; setMsg(""); renderDigits(); }
  if (entered.length === n) check();
}
async function check(){
  if (busy) return;
  const n = pub[current].codeLen;
  if (entered.length < n){ setMsg("Bitte " + n + " Ziffern eingeben.", true); return; }
  busy = true; setMsg("Prüfe …");
  let res; try { res = await openApi(current, entered); } catch (e) { res = {ok: false, error: "net"}; }
  busy = false;
  if (res.ok){ $("codeOverlay").classList.remove("show"); showRead(current, res); return; }
  entered = ""; renderDigits();
  if (res.error === "soon"){ closeCode(); toast("Dieses Buch ist noch nicht verfügbar."); return; }
  setMsg(res.error === "wrong" ? "Falscher Code. Versuche es nochmal."
       : res.error === "wait"  ? "Zu viele Versuche. Bitte eine Minute warten."
       : res.error === "net"   ? "Keine Verbindung. Versuche es nochmal."
       : "Das hat nicht geklappt.", true);
  const box = $("codeBox"); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
}

// ---------- Akte lesen ----------
function showRead(i, res){
  const t = $("fileText"); t.innerHTML = ""; fileIndex = null; $("saveFile").hidden = true;
  $("fileTitle").textContent = res.title; $("fileSub").textContent = COVERS[i].band;
  res.text.forEach(p => { const el = document.createElement("p"); el.textContent = p; t.appendChild(el); });
  $("fileOverlay").classList.add("show"); $("closeFile").focus();
}
function closeFile(){ $("fileOverlay").classList.remove("show"); restoreFocus(); }

// ---------- Editor (nur Admin) ----------
function showEditor(i){
  const d = adminData[i], t = $("fileText");
  fileIndex = i; $("saveFile").hidden = false;
  $("fileTitle").textContent = "Akte bearbeiten"; $("fileSub").textContent = COVERS[i].band;
  t.innerHTML = '<label for="editTitle">Titel</label><input id="editTitle" type="text">'
    + '<label for="editCode">Code (nur Ziffern, höchstens 8; leer = ohne Code offen)</label>'
    + '<input id="editCode" type="text" inputmode="numeric" maxlength="8" autocomplete="off">'
    + '<label class="chk"><input id="editSoon" type="checkbox"><span>Noch nicht verfügbar (Besucher können das Buch nicht öffnen, das Cover zeigt Zauberschrift)</span></label>'
    + '<label for="editText">Text (Leerzeile = neuer Absatz)</label><textarea id="editText"></textarea>'
    + '<p class="hint" id="editHint"></p>';
  $("editHint").textContent = "Die Änderung gilt nur, bis du die Seite neu lädst. Dauerhaft ändern geht in der Datei index.html.";
  $("editTitle").value = d.title; $("editCode").value = d.code; $("editSoon").checked = d.soon; $("editText").value = d.text.join("\n\n");
  $("fileOverlay").classList.add("show"); $("closeFile").focus();
}
async function saveFile(){
  const i = fileIndex, code = $("editCode").value.trim();
  if (!/^\d{0,8}$/.test(code)){ toast("Code: nur Ziffern, höchstens 8."); return; }
  const rec = {
    title: $("editTitle").value.trim() || adminData[i].title, code, soon: $("editSoon").checked,
    text: $("editText").value.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean)
  };
  if (!rec.text.length) rec.text = ["Text folgt."];
  $("saveFile").disabled = true; toast("Speichere …", 8000);
  try {
    const r = await saveApi(i, rec);
    if (r && r.ok){
      adminData[i] = Object.assign(adminData[i], rec);
      pub[i] = {title: rec.soon ? "" : rec.title, soon: rec.soon, codeLen: rec.code.length};
      renderShelf();
      toast("Gespeichert (nur bis zum Neuladen).", 4000);
    } else toast(r && r.error === "auth" ? "Login ungültig. Melde dich neu an." : "Speichern fehlgeschlagen.", 5000);
  } catch (e) { toast("Speichern fehlgeschlagen.", 5000); }
  $("saveFile").disabled = false;
}

// ---------- Admin-Login ----------
function updateAdmin(){
  $("loginForm").hidden = admin; $("loggedIn").hidden = !admin;
  renderShelf();
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const u = $("user").value.trim(), pw = $("pass").value;
  $("loginErr").textContent = "Prüfe …";
  let res; try { res = await adminApi(u, pw); } catch (err) { $("loginErr").textContent = "Keine Verbindung."; return; }
  if (res && res.ok){
    admin = true; cred = {user: u, pass: pw}; adminData = res.books;
    $("loginErr").textContent = ""; $("pass").value = ""; $("user").value = "";
  } else { $("loginErr").textContent = "Login falsch."; }
  updateAdmin();
});
$("logout").addEventListener("click", () => { admin = false; cred = null; adminData = null; updateAdmin(); });

// ---------- Dialoge ----------
$("cancel").addEventListener("click", closeCode);
$("saveFile").addEventListener("click", saveFile);
$("closeFile").addEventListener("click", closeFile);
[["codeOverlay", closeCode], ["fileOverlay", closeFile]].forEach(([id, fn]) =>
  $(id).addEventListener("click", e => { if (e.target === $(id)) fn(); }));
document.addEventListener("keydown", e => {
  if ($("codeOverlay").classList.contains("show")){
    if (e.key >= "0" && e.key <= "9") press(e.key);
    else if (e.key === "Backspace") press("⌫");
    else if (e.key === "Enter" && document.activeElement.tagName !== "BUTTON") press("OK");
    else if (e.key === "Escape") closeCode();
  } else if (e.key === "Escape" && $("fileOverlay").classList.contains("show")) closeFile();
});

// ---------- Start ----------
